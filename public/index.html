<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Myself">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Myself</title>
<style>
:root{
  --bg:#000; --s1:#0e0e0f; --s2:#17171a; --s3:#222226; --line:#26262b;
  --tx:#f4f4f5; --tx2:#a1a1aa; --tx3:#6b6b73;
  --acc:#ffffff; --ok:#3ddc97; --warn:#ffb547; --bad:#ff5f57;
  --c-ent:#5b8cff; --c-sport:#3ddc97; --c-apps:#b57bff; --c-etu:#ffb547; --c-perso:#ff7aa8;
  --r:16px; --r-sm:12px;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --nav:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100dvh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,select,textarea{font-size:16px} /* évite le zoom auto de Safari */
.hidden{display:none!important}

/* Layout */
main{padding-block:calc(var(--sat) + 12px) calc(var(--nav) + var(--sab) + 96px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:560px;margin:0 auto}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:8px 0 20px}
.eyebrow{color:var(--tx3);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
h1{font-size:30px;line-height:1.15;margin:4px 0 0;font-weight:700;letter-spacing:-.02em}
h2{font-size:13px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin:28px 4px 10px;display:flex;justify-content:space-between;align-items:center}
h2 button{color:var(--tx2);font-size:13px;text-transform:none;letter-spacing:0;font-weight:500;min-height:44px;min-width:44px;padding:0 4px;margin:-12px 0}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--s2);color:var(--tx2);flex:none}
.icon-btn svg{width:20px;height:20px}

/* Cards */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.hero{display:flex;align-items:center;gap:18px;padding:18px}
.ring{width:72px;height:72px;flex:none;position:relative}
.ring svg{width:72px;height:72px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:700}
.hero p{margin:0;color:var(--tx2);font-size:14px}
.hero strong{display:block;font-size:20px;color:var(--tx);margin-bottom:2px}
.alert{display:flex;align-items:center;gap:10px;margin-top:10px;padding:12px 14px;border-radius:var(--r-sm);background:rgba(255,95,87,.1);color:#ff8a84;font-size:14px;font-weight:500;width:100%;text-align:left;min-height:48px}

/* Task rows */
.list{display:flex;flex-direction:column}
.task{display:flex;align-items:center;gap:4px;min-height:56px;padding:0 6px 0 2px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.check{width:48px;height:48px;flex:none;display:grid;place-items:center}
.check i{width:24px;height:24px;border-radius:50%;border:2px solid var(--tx3);display:grid;place-items:center;transition:.15s}
.task.p1 .check i{border-color:var(--warn)}
.task.p2 .check i{border-color:var(--bad)}
.task.done .check i{background:var(--ok);border-color:var(--ok)}
.task.done .check i::after{content:"";width:6px;height:11px;border:solid #000;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task .body{flex:1;min-width:0;padding:9px 0;text-align:left}
.task .t{font-size:16px;line-height:1.3;word-break:break-word}
.task.done .t{color:var(--tx3);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;font-size:13px;color:var(--tx3);align-items:center}
.meta .late{color:#ff8a84}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
.empty{padding:28px 18px;text-align:center;color:var(--tx3);font-size:15px}
.empty b{display:block;color:var(--tx2);font-size:16px;margin-bottom:4px}

/* Projects */
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.pcard{flex:0 0 150px;scroll-snap-align:start;padding:14px;text-align:left;min-height:112px;display:flex;flex-direction:column;justify-content:space-between}
.pcard .n{font-weight:600;font-size:16px;margin-top:8px;line-height:1.25}
.pcard .c{font-size:13px;color:var(--tx3)}
.bar{height:4px;border-radius:4px;background:var(--s3);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:4px}
.prow{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:72px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.prow:last-child{border-bottom:0}
.prow .sq{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;flex:none}
.prow .info{flex:1;min-width:0}
.prow .n{font-weight:600}
.chev{color:var(--tx3);font-size:20px}

/* Apps */
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--tx2);min-height:44px}
.app .ic{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;font-size:24px;font-weight:700;color:#000}
.app.add .ic{background:var(--s2);color:var(--tx2);border:1px dashed var(--s3)}
.app span{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 6px;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;background:var(--s2);color:var(--tx2);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;border:1px solid transparent}
.chip.on{background:var(--tx);color:#000}
.sheet .chip.on{background:var(--tx);color:#000}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;
  padding:6px 8px calc(var(--sab) + 6px);background:rgba(0,0,0,.82);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line)}
nav.tabs button{flex:1;max-width:110px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--tx3);font-size:11px;font-weight:500}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--tx)}
.fab{position:fixed;right:max(16px,calc(50vw - 264px));bottom:calc(var(--nav) + var(--sab) + 16px);z-index:21;width:60px;height:60px;border-radius:50%;
  background:var(--acc);color:#000;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.1)}
.fab svg{width:28px;height:28px}
.fab:active,.chip:active,.icon-btn:active{transform:scale(.94)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;max-height:92dvh;overflow-y:auto;
  background:var(--s1);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;
  padding:8px 16px calc(var(--sab) + 20px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--s3);margin:4px auto 10px}
.sheet h3{margin:0 0 14px;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{color:var(--tx2);font-size:16px;font-weight:500;min-height:44px;padding:0 4px}
.field{margin-bottom:16px}
.field > label{display:block;font-size:13px;color:var(--tx3);font-weight:600;margin:0 4px 8px;text-transform:uppercase;letter-spacing:.05em}
.inp{width:100%;min-height:50px;padding:12px 14px;border-radius:var(--r-sm);background:var(--s2);border:1px solid var(--line);outline:none;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:#4a4a52}
.inp.big{font-size:18px;font-weight:500}
textarea.inp{min-height:84px;resize:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=date].inp,input[type=time].inp{display:block;min-width:0}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.btn{width:100%;min-height:52px;border-radius:14px;background:var(--acc);color:#000;font-weight:600;font-size:17px;margin-top:6px}
.btn.ghost{background:var(--s2);color:var(--tx)}
.btn.danger{background:transparent;color:var(--bad)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:40px;height:40px;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:var(--tx)}
.hint{font-size:13px;color:var(--tx3);margin:6px 4px 0}

/* Toast */
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--nav) + var(--sab) + 90px);z-index:60;max-width:528px;margin:0 auto;
  background:var(--tx);color:#000;border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-weight:500;font-size:15px;transform:translateY(20px);opacity:0;pointer-events:none;transition:.2s}
.toast.on{transform:none;opacity:1;pointer-events:auto}
.toast button{min-height:40px;padding:0 14px;border-radius:10px;background:#000;color:#fff;font-weight:600;font-size:14px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--tx2);min-height:44px;font-size:16px;margin-left:-4px}
.sub{color:var(--tx2);font-size:15px;margin-top:4px}
</style>
</head>
<body>
<main id="app"></main>

<button class="fab" id="fab" aria-label="Nouvelle tâche">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabs" id="tabs">
  <button data-v="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
  <button data-v="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 7 2 2 4-4M4 17l2 2 4-4M14 7h6M14 17h6"/></svg>Tâches</button>
  <button data-v="projects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Projets</button>
  <button data-v="apps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.2"/><circle cx="12" cy="6" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="6" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="18" cy="12" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="12" cy="18" r="2.2"/><circle cx="18" cy="18" r="2.2"/></svg>Apps</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn">Annuler</button></div>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">

<script>
"use strict";
/* ============ Données ============ */
const KEY = "myself.v1";
const CATS = {
  ent:   {label:"Entreprise", color:"var(--c-ent)"},
  sport: {label:"Sport",      color:"var(--c-sport)"},
  apps:  {label:"Mes apps",   color:"var(--c-apps)"},
  etu:   {label:"Études",     color:"var(--c-etu)"},
  perso: {label:"Perso",      color:"var(--c-perso)"}
};
const COLORS = ["#5b8cff","#3ddc97","#b57bff","#ffb547","#ff7aa8","#5ad8e6","#ff5f57","#e4e4e7"];
const REPEAT = {none:"Jamais", daily:"Chaque jour", weekdays:"Lun → ven", weekly:"Chaque semaine", monthly:"Chaque mois"};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function defaults(){
  const p1 = uid(), p2 = uid(), p3 = uid();
  return {
    v:2, name:"Alou",
    projects:[
      {id:p1, name:"Mon entreprise", cat:"ent", color:COLORS[0]},
      {id:p2, name:"Sport", cat:"sport", color:COLORS[1]},
      {id:p3, name:"Mes apps", cat:"apps", color:COLORS[2]}
    ],
    tasks:[
      {id:uid(), title:"Bienvenue 👋 Touche le rond pour cocher", date:today(), time:null, projectId:null, priority:0, repeat:"none", notes:"", done:false, createdAt:Date.now()},
      {id:uid(), title:"Séance de sport", date:today(), time:"18:00", projectId:p2, priority:1, repeat:"weekly", notes:"", done:false, createdAt:Date.now()},
      {id:uid(), title:"Définir les 3 objectifs du mois", date:addDays(today(),1), time:null, projectId:p1, priority:2, repeat:"none", notes:"", done:false, createdAt:Date.now()}
    ],
    apps:[
      {id:uid(), name:"Binvio", url:"", color:"#5b8cff"},
      {id:uid(), name:"My Gym", url:"", color:"#3ddc97"},
      {id:uid(), name:"G Calendar", url:"https://calendar.google.com/calendar/r", color:"#ff5f57"},
      {id:uid(), name:"Le brief", url:"", color:"#ffb547"}
    ],
    log:[] // {taskId, date} : historique des tâches cochées
  };
}
let S;
function load(){
  try{ const raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : defaults(); }
  catch(e){ S = defaults(); }
  S.log = S.log || [];
  if((S.v||1) < 2){ // v2 : Google Calendar à la place de Calendrier, "Le brief" à la place de Rappels
    S.apps = S.apps.filter(a=>a.name!=="Rappels");
    const cal = S.apps.find(a=>a.name==="Calendrier");
    if(cal){ cal.name="G Calendar"; cal.url="https://calendar.google.com/calendar/r"; }
    if(!S.apps.some(a=>a.name==="Le brief")) S.apps.push({id:uid(), name:"Le brief", url:"", color:"#ffb547"});
    S.v = 2;
  }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ============ Dates ============ */
function iso(d){ const z=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate()); }
function parse(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function today(){ return iso(new Date()); }
function addDays(s,n){ const d=parse(s); d.setDate(d.getDate()+n); return iso(d); }
function diff(a,b){ return Math.round((parse(a)-parse(b))/864e5); }
const fmtLong = new Intl.DateTimeFormat("fr-FR",{weekday:"long",day:"numeric",month:"long"});
const fmtShort = new Intl.DateTimeFormat("fr-FR",{weekday:"short",day:"numeric",month:"short"});
function relDate(s){
  const n = diff(s,today());
  if(n===0) return "Aujourd'hui";
  if(n===1) return "Demain";
  if(n===-1) return "Hier";
  if(n<0) return "Il y a "+(-n)+" j";
  if(n<7) return fmtShort.format(parse(s)).split(" ")[0].replace(".","");
  return fmtShort.format(parse(s));
}
function nextDate(s,rep){
  const d=parse(s);
  if(rep==="daily") d.setDate(d.getDate()+1);
  else if(rep==="weekly") d.setDate(d.getDate()+7);
  else if(rep==="monthly") d.setMonth(d.getMonth()+1);
  else if(rep==="weekdays"){ do{ d.setDate(d.getDate()+1); }while(d.getDay()===0||d.getDay()===6); }
  return iso(d);
}
function weekendDate(){ const d=new Date(); const add=(6-d.getDay()+7)%7; d.setDate(d.getDate()+add); return iso(d); }

/* ============ Helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const proj = id => S.projects.find(p=>p.id===id);
const pending = () => S.tasks.filter(t=>!t.done);
function sortTasks(a,b){
  return (a.date||"9999").localeCompare(b.date||"9999")
      || (b.priority-a.priority)
      || (a.time||"99").localeCompare(b.time||"99")
      || a.createdAt-b.createdAt;
}
function todayStats(){
  const t = today();
  const doneToday = S.log.filter(l=>l.date===t).length;
  const left = pending().filter(x=>x.date && x.date<=t).length;
  return {done:doneToday, total:doneToday+left, left};
}

/* ============ Rendu ============ */
let view = "home", filter = "all", openProject = null;
const ICON_GEAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';

function taskRow(t){
  const p = proj(t.projectId);
  const late = !t.done && t.date && t.date < today();
  const meta = [];
  if(t.date) meta.push(`<span class="${late?"late":""}">${relDate(t.date)}${t.time?" · "+t.time:""}</span>`);
  else if(t.time) meta.push(`<span>${t.time}</span>`);
  if(t.repeat && t.repeat!=="none") meta.push(`<span>↻ ${REPEAT[t.repeat]}</span>`);
  if(p) meta.push(`<span><i class="dot" style="background:${p.color}"></i>${esc(p.name)}</span>`);
  return `<div class="task p${t.priority}${t.done?" done":""}" data-id="${t.id}">
    <button class="check" data-act="toggle" aria-label="Cocher"><i></i></button>
    <button class="body" data-act="edit"><div class="t">${esc(t.title)}</div>${meta.length?`<div class="meta">${meta.join("")}</div>`:""}</button>
  </div>`;
}
function listCard(tasks, emptyTitle, emptyText){
  if(!tasks.length) return `<div class="card"><div class="empty"><b>${emptyTitle}</b>${emptyText||""}</div></div>`;
  return `<div class="card list">${tasks.map(taskRow).join("")}</div>`;
}
function ring(done,total){
  const pct = total ? done/total : 0, r=30, c=2*Math.PI*r;
  return `<div class="ring"><svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="${r}" fill="none" stroke="var(--s3)" stroke-width="7"/>
    <circle cx="36" cy="36" r="${r}" fill="none" stroke="var(--ok)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}" style="transition:stroke-dashoffset .4s"/></svg>
    <b>${Math.round(pct*100)}%</b></div>`;
}
function projStats(p){
  const all = S.tasks.filter(t=>t.projectId===p.id);
  const done = all.filter(t=>t.done).length;
  return {left: all.length-done, pct: all.length? done/all.length : 0};
}
function appTile(a){
  return `<button class="app" data-app="${a.id}"><div class="ic" style="background:${a.color}">${esc(a.name.trim()[0]||"?").toUpperCase()}</div><span>${esc(a.name)}</span></button>`;
}

function renderHome(){

  const late = pending().filter(x=>x.date && x.date<t);
  const todays = pending().filter(x=>x.date===t).sort(sortTasks);

  const msg = !st.total ? "Rien de prévu. Ajoute ta première tâche."
            : st.left===0 ? "Tout est fait. Bien joué 🔥"

  return `
  <header class="top">
    <div><div class="eyebrow">${fmtLong.format(new Date())}</div><h1>${greet} ${esc(S.name)}</h1></div>
    <button class="icon-btn" data-act="settings" aria-label="Réglages">${ICON_GEAR}</button>
  </header>
  <div class="card hero">${ring(st.done,st.total)}<div><strong>${st.done}/${st.total} faites</strong><p>${msg}</p></div></div>

  <h2>Projets <button data-act="goProjects">Gérer</button></h2>

      <div><i class="dot" style="background:${p.color}"></i><span class="c">${CATS[p.cat]?.label||""}</span><div class="n">${esc(p.name)}</div></div>
      <div><div class="c">${s.left} à faire</div><div class="bar"><i style="width:${s.pct*100}%;background:${p.color}"></i></div></div></button>`}).join("")}

  <h2>Mes apps <button data-act="goApps">Gérer</button></h2>

function renderTasks(){
  const t = today(), tm = addDays(t,1), wk = addDays(t,7);
  let items = pending();
  if(filter!=="all") items = items.filter(x=> filter==="none" ? !x.projectId : x.projectId===filter);
  items.sort(sortTasks);
  const groups = [
    ["En retard", items.filter(x=>x.date && x.date<t)],
    ["Aujourd'hui", items.filter(x=>x.date===t)],
    ["Demain", items.filter(x=>x.date===tm)],
    ["Cette semaine", items.filter(x=>x.date>tm && x.date<=wk)],
    ["Plus tard", items.filter(x=>x.date>wk)],
    ["Sans date", items.filter(x=>!x.date)]
  ].filter(g=>g[1].length);
  const done = S.tasks.filter(x=>x.done && (filter==="all"||x.projectId===filter)).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)).slice(0,15);
  return `
  <header class="top"><div><div class="eyebrow">${pending().length} à faire</div><h1>Tâches</h1></div></header>
  <div class="chips">
    <button class="chip${filter==="all"?" on":""}" data-filter="all">Tout</button>
    ${S.projects.map(p=>`<button class="chip${filter===p.id?" on":""}" data-filter="${p.id}"><i class="dot" style="background:${p.color};margin:0"></i>${esc(p.name)}</button>`).join("")}
    <button class="chip${filter==="none"?" on":""}" data-filter="none">Sans projet</button>
  </div>
  ${groups.length ? groups.map(g=>`<h2>${g[0]} <span>${g[1].length}</span></h2>${listCard(g[1])}`).join("")
    : `<div style="margin-top:16px">${listCard([], "Rien à faire ici", "Profite, ou ajoute une tâche avec +.")}</div>`}

}

  }</div>`;

}

/* ============ Actions tâches ============ */
let undoSnap = null, toastTimer;
function snapshot(){ undoSnap = JSON.stringify(S); }
function toast(msg, undo=true){
  $("#toastMsg").textContent = msg;
  $("#toastBtn").classList.toggle("hidden", !undo);
  $("#toast").classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>$("#toast").classList.remove("on"), 4000);
}
$("#toastBtn").onclick = ()=>{ if(undoSnap){ S=JSON.parse(undoSnap); undoSnap=null; save(); render(); } $("#toast").classList.remove("on"); };

function toggleTask(id){
  const t = S.tasks.find(x=>x.id===id); if(!t) return;
  snapshot();
  if(t.done){ // décocher
    t.done=false; t.doneAt=null;
    const i = S.log.map(l=>l.taskId).lastIndexOf(id); if(i>-1) S.log.splice(i,1);
    save(); render(); return;
  }
  S.log.push({taskId:id, date:today()});
  if(S.log.length>2000) S.log = S.log.slice(-2000);
  if(t.repeat && t.repeat!=="none"){
    let n = t.date || today();
    do{ n = nextDate(n,t.repeat); }while(n <= today());
    t.date = n;
    if(navigator.vibrate) navigator.vibrate(10);
    save(); render(); toast("Fait ✓ Prochaine : "+relDate(n).toLowerCase());
  } else {
    t.done=true; t.doneAt=Date.now();
    save();
    const row = document.querySelector(`.task[data-id="${id}"]`);
    if(row) row.classList.add("done");
    setTimeout(render, 350);
    toast("Tâche terminée ✓");
  }
}

function chipSet(name, options, value){
  return `<div class="wrap" data-group="${name}">${options.map(([v,l])=>`<button type="button" class="chip${v===value?" on":""}" data-val="${esc(v)}">${l}</button>`).join("")}</div>`;
}
function groupVal(name){ return $(`#sheet [data-group="${name}"] .chip.on`)?.dataset.val ?? ""; }

function taskSheet(id, preset={}){
  const t = id ? S.tasks.find(x=>x.id===id) : {title:"",date:today(),time:"",projectId:preset.projectId||null,priority:0,repeat:"none",notes:""};
  if(!t) return;
  const td=today(), tm=addDays(td,1), we=weekendDate();
  const dateQuick = [[td,"Aujourd'hui"],[tm,"Demain"],[we,"Ce week-end"],["","Sans date"]].filter((d,i,a)=>a.findIndex(x=>x[0]===d[0])===i);
  openSheet(`
    <h3>${id?"Modifier":"Nouvelle tâche"} <button data-act="close">Fermer</button></h3>
    <div class="field"><input class="inp big" id="fTitle" placeholder="Qu'est-ce que tu dois faire ?" value="${esc(t.title)}" enterkeyhint="done" autocomplete="off"></div>
    <div class="field"><label>Quand</label>${chipSet("dq", dateQuick, dateQuick.some(d=>d[0]===(t.date||""))?(t.date||""):"__")}
      <div class="row2" style="margin-top:10px"><input type="date" class="inp" id="fDate" value="${t.date||""}"><input type="time" class="inp" id="fTime" value="${t.time||""}"></div></div>
    <div class="field"><label>Projet</label>${chipSet("proj", [["","Aucun"], ...S.projects.map(p=>[p.id,`<i class="dot" style="background:${p.color};margin:0"></i>${esc(p.name)}`])], t.projectId||"")}</div>
    <div class="field"><label>Priorité</label>${chipSet("prio", [["0","Normale"],["1","Importante"],["2","Urgente"]], String(t.priority))}</div>
    <div class="field"><label>Répéter</label>${chipSet("rep", Object.entries(REPEAT), t.repeat||"none")}</div>
    <div class="field"><label>Notes</label><textarea class="inp" id="fNotes" placeholder="Détails, lien, adresse…">${esc(t.notes)}</textarea></div>
    <button class="btn" data-act="saveTask" data-id="${id||""}">${id?"Enregistrer":"Ajouter la tâche"}</button>
    ${id?`<div class="btns" style="margin-top:10px"><button class="btn ghost" data-act="ics" data-id="${id}">📅 Calendrier</button><button class="btn ghost" data-act="delTask" data-id="${id}" style="color:var(--bad)">Supprimer</button></div>`:""}
  `);
  // lien raccourcis date <-> champ date
  $("#sheet [data-group=dq]").addEventListener("click",e=>{ const c=e.target.closest(".chip"); if(c) $("#fDate").value=c.dataset.val; });
  $("#fDate").addEventListener("change",()=>{ document.querySelectorAll("#sheet [data-group=dq] .chip").forEach(c=>c.classList.toggle("on", c.dataset.val===$("#fDate").value)); });
  $("#fTitle").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); saveTask(id); }});
  if(!id) $("#fTitle").focus();
}
function saveTask(id){
  const title = $("#fTitle").value.trim();
  if(!title){ $("#fTitle").focus(); $("#fTitle").style.borderColor="var(--bad)"; return; }
  const data = {
    title, date: $("#fDate").value || null, time: $("#fTime").value || null,
    projectId: groupVal("proj") || null, priority: Number(groupVal("prio")||0),
    repeat: groupVal("rep") || "none", notes: $("#fNotes").value.trim()
  };
  if(data.repeat!=="none" && !data.date) data.date = today();
  snapshot();
  if(id) Object.assign(S.tasks.find(x=>x.id===id), data);
  else S.tasks.push({id:uid(), done:false, createdAt:Date.now(), ...data});
  save(); closeSheet(); render(); toast(id?"Modifiée":"Tâche ajoutée");
}
function exportICS(id){
  const t = S.tasks.find(x=>x.id===id); if(!t) return;
  if(!t.date){ toast("Ajoute une date d'abord", false); return; }
  const d = t.date.replace(/-/g,"");
  const pad = n=>String(n).padStart(2,"0");
  let dt;
  if(t.time){ const [h,m]=t.time.split(":").map(Number); const e=new Date(parse(t.date)); e.setHours(h,m+60);
    dt = `DTSTART:${d}T${pad(h)}${pad(m)}00\r\nDTEND:${iso(e).replace(/-/g,"")}T${pad(e.getHours())}${pad(e.getMinutes())}00`; }
  else dt = `DTSTART;VALUE=DATE:${d}\r\nDTEND;VALUE=DATE:${addDays(t.date,1).replace(/-/g,"")}`;
  const rr = {daily:"FREQ=DAILY",weekdays:"FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR",weekly:"FREQ=WEEKLY",monthly:"FREQ=MONTHLY"}[t.repeat];
  const clean = s=>s.replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n");
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Myself//FR","BEGIN:VEVENT",`UID:${t.id}@myself`,
    `DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").slice(0,15)}Z`, dt, `SUMMARY:${clean(t.title)}`,
    t.notes?`DESCRIPTION:${clean(t.notes)}`:"", rr?`RRULE:${rr}`:"", "BEGIN:VALARM","TRIGGER:-PT15M","ACTION:DISPLAY","DESCRIPTION:Rappel","END:VALARM",
    "END:VEVENT","END:VCALENDAR"].filter(Boolean).join("\r\n");
  download(new Blob([ics],{type:"text/calendar"}), "tache.ics");
}
function download(blob, name){
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);
}

// Confirmation en deux temps (pas de popup système) : 1er appui arme le bouton, 2e appui valide
function armed(el, msg){
  if(el.dataset.armed) return true;
  el.dataset.armed="1"; const txt=el.textContent; el.textContent=msg;
  setTimeout(()=>{ delete el.dataset.armed; el.textContent=txt; },3000);
  return false;
}
/* ============ Délégation des événements ============ */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act],[data-v],[data-filter],[data-app],#sheet .chip");
  if(!el) return;
  // sélection de chips dans une feuille
  if(el.matches("#sheet [data-group] .chip")){
    const g=el.closest("[data-group]");
    g.querySelectorAll(".chip").forEach(c=>{ c.classList.remove("on"); if(g.classList.contains("colors")) c.style.borderColor="transparent"; });
    el.classList.add("on"); if(g.classList.contains("colors")) el.style.borderColor="#fff";
    return;
  }
  if(el.dataset.v) return go(el.dataset.v);
  if(el.dataset.filter){ filter=el.dataset.filter; return render(); }
  if(el.dataset.app) return openApp(el.dataset.app);
  const id = el.dataset.id || el.closest(".task")?.dataset.id;
  switch(el.dataset.act){
    case "toggle": return toggleTask(id);
    case "edit": return taskSheet(id);
    case "close": return closeSheet();
    case "saveTask": return saveTask(el.dataset.id||null);
    case "delTask": snapshot(); S.tasks=S.tasks.filter(t=>t.id!==id); save(); closeSheet(); render(); return toast("Tâche supprimée");
    case "ics": return exportICS(id);
    case "settings": return settingsSheet();
    case "saveSettings": S.name=$("#sName").value.trim()||"toi"; save(); closeSheet(); return render();
    case "goTasks": filter="all"; return go("tasks");
    case "goLate": filter="all"; return go("tasks");
    case "goProjects": return go("projects");
    case "goApps": return go("apps");
    case "newProject": return projectSheet();
    case "editProject": return projectSheet(openProject);
    case "saveProject": return saveProject(el.dataset.id||null);
    case "delProject":
      if(!armed(el, "Touche encore : les tâches restent, sans projet")) return;
      snapshot(); S.projects=S.projects.filter(p=>p.id!==id); S.tasks.forEach(t=>{ if(t.projectId===id) t.projectId=null; });
      openProject=null; save(); closeSheet(); render(); return toast("Projet supprimé");
    case "closeProject": openProject=null; return render();
    case "newApp": return appSheet();
    case "saveApp": return saveApp(el.dataset.id||null);
    case "delApp": S.apps=S.apps.filter(a=>a.id!==id); save(); closeSheet(); return render();
    case "export": return download(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}), `myself-${today()}.json`);
    case "import": return $("#importFile").click();
    case "reset": if(armed(el, "Touche encore pour tout effacer")){ S=defaults(); save(); closeSheet(); go("home"); } return;
  }
});

let pressTimer;

},{passive:true});

});
document.addEventListener("touchmove", ()=>{ clearTimeout(pressTimer); },{passive:true});
document.addEventListener("contextmenu", e=>{ const a=e.target.closest("[data-app]"); if(a){ e.preventDefault(); appSheet(a.dataset.app); }});

$("#fab").onclick = ()=> taskSheet(null, {projectId: view==="projects" ? openProject : (view==="tasks" && filter!=="all" && filter!=="none" ? filter : null)});
$("#importFile").onchange = async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{ const d=JSON.parse(await f.text()); if(!d.tasks||!d.projects) throw 0; snapshot(); S=d; S.log=S.log||[]; save(); closeSheet(); render(); toast("Données importées"); }
  catch(_){ toast("Fichier invalide", false); }
  e.target.value="";
};

// Rafraîchir quand on revient sur l'app (changement de jour, etc.)
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) render(); });

load(); save(); render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
