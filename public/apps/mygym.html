<!doctype html><html><head><script src="/shim.js"></script><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MyGym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* MyGym V2 : appli mobile d'abord (barre d'onglets en bas), charte crème / noir des outils d'Alou, icônes dessinées en SVG (aucun emoji). */
:root {
  --cream: #F4ECDD;
  --paper: #FBF7EF;
  --beige: #E4D5BB;
  --ink: #121110;
  --muted: #645B4C;
  --shadow: 5px 5px 0 var(--ink);
  --shadow-up: 8px 8px 0 var(--ink);
  --ease: cubic-bezier(.2, .9, .25, 1.2);
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Instrument Sans", "Helvetica Neue", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--cream); margin: 0; }
body { color: var(--ink); font: 16px/1.5 var(--font-body); -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px calc(120px + env(safe-area-inset-bottom, 0px)); }
[hidden] { display: none !important; }
.i { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -0.22em; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 10px; animation: drop .7s var(--ease) backwards; }
.brand svg { width: 46px; height: 46px; animation: float 4s ease-in-out .8s infinite; }
h1 { font: 800 2.2rem/0.9 var(--font-display); letter-spacing: -0.035em; margin: 0; }
h1 em { font-style: normal; display: inline-block; background: var(--ink); color: var(--cream); padding: 0 .16em .05em; border-radius: 8px; transform: rotate(-3deg); }
.avatar { width: 46px; height: 46px; padding: 0; border-radius: 50%; font: 800 1.2rem/1 var(--font-display); box-shadow: 3px 3px 0 var(--ink); background: var(--beige); }

.ticker { background: var(--ink); color: var(--cream); border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; margin-bottom: 22px; box-shadow: var(--shadow); }
.ticker-track { display: flex; align-items: center; width: max-content; animation: scroll 30s linear infinite; }
.ticker span { font: 600 12px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; padding: 10px 0; white-space: nowrap; }
.ticker b { color: var(--beige); padding-inline: 14px; display: inline-flex; }
.ticker b .i { width: 12px; height: 12px; fill: currentColor; stroke: none; }

.card { background: var(--paper); border: 2px solid var(--ink); border-radius: 18px; box-shadow: var(--shadow); padding: 18px; margin-bottom: 18px; animation: drop .6s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 70ms); }
.card h2 { font: 800 1.35rem/1.1 var(--font-display); letter-spacing: -0.02em; margin: 0 0 12px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.kicker { font: 500 11px/1.3 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .85rem; }

button {
  font: 600 15px/1 var(--font-body); border-radius: 999px; padding: 13px 18px; cursor: pointer;
  border: 2px solid var(--ink); background: var(--paper); color: var(--ink); box-shadow: 4px 4px 0 var(--ink);
  transition: transform .12s ease, box-shadow .12s ease, background .2s;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
button:hover { background: var(--beige); }
button:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
button.primary { background: var(--ink); color: var(--cream); }
button.primary:hover { background: #2B2925; }
button:disabled { opacity: .45; cursor: default; transform: none; box-shadow: 4px 4px 0 var(--ink); }
button.ghost { box-shadow: none; border-width: 1.5px; padding: 8px 12px; font-size: 13px; }
button.ghost:active { transform: scale(.96); }
.big { width: 100%; padding: 18px; font-size: 1.05rem; border-radius: 16px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > * { flex: 1 1 0; min-width: 0; }

/* Onboarding */
.onb { min-height: 66vh; display: flex; flex-direction: column; justify-content: center; }
.onb h2 { font: 800 clamp(1.9rem, 8vw, 2.5rem)/1 var(--font-display); letter-spacing: -0.03em; margin: 0 0 8px; }
.onb .hint { color: var(--muted); margin: 0 0 18px; font-size: .92rem; }
.steps { display: flex; gap: 6px; margin-bottom: 26px; }
.steps i { flex: 1; height: 8px; border-radius: 99px; border: 2px solid var(--ink); background: var(--paper); transition: background .3s; }
.steps i.on { background: var(--ink); }
.choices { display: grid; gap: 10px; }
.choice { text-align: left; justify-content: flex-start; padding: 14px 16px; border-radius: 16px; gap: 14px; font-size: 1.02rem; position: relative; }
.choice .ico { width: 42px; height: 42px; border: 2px solid currentColor; border-radius: 12px; display: grid; place-items: center; flex: none; }
.choice .ico .i { width: 22px; height: 22px; }
.choice small { display: block; font-weight: 400; color: var(--muted); font-size: .84rem; margin-top: 3px; }
.choice.sel { background: var(--ink); color: var(--cream); }
.choice.sel small { color: var(--beige); }
.choice .order { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border-radius: 50%; background: var(--cream); color: var(--ink); display: grid; place-items: center; font: 800 14px/1 var(--font-display); animation: pop .35s var(--ease); }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; min-width: 0; }
.field label { font-weight: 600; font-size: .95rem; }
.field label span { font-weight: 400; color: var(--muted); font-size: .85rem; }
input[type=text], input[type=number], input[type=search], textarea, select {
  font: 500 1.1rem/1.3 var(--font-body); color: var(--ink); background: var(--paper); border: 2px solid var(--ink);
  border-radius: 12px; padding: 12px 14px; width: 100%; outline: none; box-shadow: 3px 3px 0 var(--beige); min-width: 0;
}
input:focus, textarea:focus, select:focus { box-shadow: 3px 3px 0 var(--ink); }
.seg { display: flex; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; box-shadow: 3px 3px 0 var(--ink); }
.seg button { flex: 1; border: 0; border-radius: 0; box-shadow: none; padding: 12px 6px; background: var(--paper); font-size: 14px; min-width: 0; }
.seg button + button { border-left: 2px solid var(--ink); }
.seg button.sel { background: var(--ink); color: var(--cream); }
.seg button:active { transform: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 10px 14px; border-radius: 999px; box-shadow: 2px 2px 0 var(--ink); font-size: 14px; }
.chip:active { transform: translate(2px, 2px); }
.chip.sel { background: var(--ink); color: var(--cream); }
.nav-onb { display: flex; gap: 12px; margin-top: 24px; }
.nav-onb .primary { flex: 1; }

/* Révélation des objectifs */
.reveal { text-align: center; }
.reveal .num { font: 800 clamp(3.4rem, 18vw, 5rem)/1 var(--font-display); letter-spacing: -0.04em; animation: pop .6s var(--ease) .2s backwards; }
.macros3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
.macros3 div { border: 2px solid var(--ink); border-radius: 14px; padding: 12px 6px; background: var(--paper); box-shadow: 3px 3px 0 var(--ink); animation: drop .5s var(--ease) backwards; animation-delay: calc(var(--i) * 90ms + 400ms); }
.macros3 b { display: block; font: 800 1.5rem/1 var(--font-display); }
.mode { display: inline-block; background: var(--ink); color: var(--cream); border-radius: 999px; padding: 6px 12px; font: 500 12px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; margin-top: 10px; }

/* Accueil */
.ring-wrap { display: flex; align-items: center; gap: 18px; }
.ring { position: relative; width: 148px; height: 148px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { stroke: var(--beige); }
.ring .bar { stroke: var(--ink); stroke-linecap: round; transition: stroke-dashoffset 1.1s var(--ease); }
.ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .center b { font: 800 2rem/1 var(--font-display); letter-spacing: -0.03em; }
.ring .center span { font: 500 11px/1.3 var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.ring.over .bar { stroke-dasharray: 6 5 !important; }
.mbars { flex: 1; display: grid; gap: 12px; min-width: 0; }
.mbar .lbl { display: flex; justify-content: space-between; font-size: .85rem; font-weight: 600; margin-bottom: 4px; }
.mbar .lbl span { font-family: var(--font-mono); font-weight: 400; color: var(--muted); font-size: .78rem; }
.mbar .tr { height: 12px; border: 2px solid var(--ink); border-radius: 99px; background: var(--paper); overflow: hidden; }
.mbar .fl { height: 100%; width: 0; background: var(--ink); border-radius: 99px; transition: width 1s var(--ease); }
@media (max-width: 400px) { .ring-wrap { flex-direction: column; align-items: stretch; } .ring { margin: 0 auto; } }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
.stat { background: var(--paper); border: 2px solid var(--ink); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); animation: drop .6s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 70ms); min-width: 0; }
.stat b { display: flex; align-items: center; gap: 6px; font: 800 2rem/1 var(--font-display); margin: 6px 0 2px; }
.stat b .i { width: 26px; height: 26px; }
.stats.three { grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stats.three .stat { padding: 12px 10px; }
.stats.three .stat b { font-size: 1.5rem; justify-content: center; }

/* Nutrition */
.add-btns { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; margin-bottom: 18px; }
.add-btns button { padding: 20px 10px; border-radius: 18px; font-size: 1.05rem; flex-direction: column; gap: 8px; }
.add-btns .i { width: 32px; height: 32px; }
.progress { height: 8px; border-radius: 99px; border: 2px solid var(--ink); background: repeating-linear-gradient(-45deg, var(--ink) 0 8px, var(--beige) 8px 16px); background-size: 200% 100%; animation: stripes .8s linear infinite; margin: 14px 0 6px; }
.preview { width: 100%; max-height: 240px; object-fit: cover; border: 2px solid var(--ink); border-radius: 14px; display: block; margin-bottom: 14px; }
.items { display: grid; gap: 10px; margin: 6px 0 14px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 10px; align-items: center; padding: 12px; border: 2px solid var(--ink); border-radius: 14px; background: var(--cream); animation: drop .4s var(--ease) backwards; animation-delay: calc(var(--i) * 60ms); }
.item .nm { font-weight: 600; overflow-wrap: anywhere; }
.item .nm small { display: block; font: 400 12px/1.3 var(--font-mono); color: var(--muted); margin-top: 2px; }
.qty { display: flex; align-items: center; gap: 6px; }
.sq { width: 34px; height: 34px; padding: 0; border-radius: 10px; box-shadow: 2px 2px 0 var(--ink); }
.sq:active { transform: translate(2px, 2px); }
.sq.flat { box-shadow: none; border-width: 1.5px; }
.qty .g { font: 500 13px/1 var(--font-mono); min-width: 52px; text-align: center; }
.totals { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font: 500 13px/1.4 var(--font-mono); padding: 12px 14px; background: var(--ink); color: var(--cream); border-radius: 12px; margin-bottom: 14px; }
.totals b { font: 800 1.1rem/1 var(--font-display); }
.est { font: 500 11px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; background: var(--beige); border-radius: 6px; padding: 4px 7px; }
.moment h3 { font: 800 1.05rem/1 var(--font-display); margin: 14px 0 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.moment h3 > span:first-child { display: inline-flex; gap: 8px; align-items: center; }
.moment h3 > span.k { font: 500 12px/1 var(--font-mono); color: var(--muted); }
.meal { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px; border: 2px solid var(--ink); border-radius: 14px; background: var(--paper); margin-bottom: 8px; }
.meal .th { width: 52px; height: 52px; border-radius: 10px; border: 2px solid var(--ink); object-fit: cover; background: var(--beige); display: grid; place-items: center; }
.meal .th .i { width: 24px; height: 24px; }
.meal .t { font-weight: 600; overflow-wrap: anywhere; line-height: 1.25; }
.meal .t small { display: block; font: 400 12px/1.3 var(--font-mono); color: var(--muted); }
.meal .k { font: 800 1.1rem/1 var(--font-display); text-align: right; }
.meal .k button { display: block; margin: 6px 0 0 auto; padding: 4px 8px; font-size: 11px; border-width: 1.5px; box-shadow: none; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 130px; margin-top: 8px; }
.week .col { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.week .b { width: 100%; max-width: 34px; border: 2px solid var(--ink); border-radius: 8px 8px 4px 4px; background: var(--ink); transition: height .9s var(--ease); min-height: 4px; }
.week .b.empty { background: var(--paper); }
.week .col.today .b { background: repeating-linear-gradient(-45deg, var(--ink) 0 5px, var(--muted) 5px 10px); }
.week span { font: 500 11px/1 var(--font-mono); color: var(--muted); }
.week-wrap { position: relative; }
.goal-line { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--muted); }

/* Séance */
.tpl-list { display: grid; gap: 12px; }
.tpl { text-align: left; justify-content: space-between; padding: 16px; border-radius: 16px; gap: 12px; }
.tpl b { display: block; font: 800 1.1rem/1.15 var(--font-display); }
.tpl small { display: block; font-weight: 400; color: var(--muted); font-size: .84rem; margin-top: 4px; line-height: 1.35; }
.tpl .go { width: 38px; height: 38px; border-radius: 50%; background: var(--ink); color: var(--cream); display: grid; place-items: center; flex: none; }
.tpl-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; border: 2px solid var(--ink); border-radius: 16px; padding: 14px; box-shadow: 4px 4px 0 var(--ink); background: var(--paper, #FBF7EF); }
.tpl-row b { display: block; font: 800 1.1rem/1.15 var(--font-display); }
.tpl-row small { display: block; color: var(--muted); font-size: .84rem; margin-top: 4px; line-height: 1.35; overflow-wrap: anywhere; }
.go { width: 38px; height: 38px; padding: 0; border-radius: 50%; background: var(--ink); color: var(--cream); display: grid; place-items: center; flex: none; box-shadow: none; }
.go:hover { background: var(--ink); opacity: .85; }
.day { display: grid; grid-template-columns: 52px minmax(0, 1fr) 42px; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 2px dashed var(--beige); }
.day:last-child { border-bottom: 0; }
.day .dl { border: 2px solid var(--ink); border-radius: 12px; text-align: center; padding: 6px 0; }
.day .dl b { display: block; font: 800 .95rem/1 var(--font-display); }
.day .dl span { font: 500 11px/1 var(--font-mono); color: var(--muted); }
.day.today .dl { background: var(--ink); color: var(--cream); }
.day.today .dl span { color: var(--beige); }
.day select { padding: 10px 12px; font-weight: 600; }
.day small { display: block; color: var(--muted); font-size: .8rem; margin-top: 5px; overflow-wrap: anywhere; }
.ed-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 10px 0; }
.ed-grid label { font: 500 11px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: grid; gap: 6px; }
.ed-grid input { padding: 9px 6px; text-align: center; font: 600 1.05rem/1 var(--font-mono); box-shadow: 2px 2px 0 var(--beige); }
.ex-head input.ed-in { font: 800 1.05rem/1.15 var(--font-display); padding: 8px 10px; box-shadow: 2px 2px 0 var(--beige); }
.ed-note { font-size: .9rem; padding: 10px 12px; box-shadow: 2px 2px 0 var(--beige); }
.rest-ctl { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
.rest-ctl .rest-go { flex: 1; padding: 10px 12px; font-family: var(--font-mono); }
.live-tools { margin: -6px 0 16px; flex-wrap: wrap; }
.live-tools button { flex: 1; }
button.ghost.on { background: var(--ink); color: var(--cream); }
.i.up, .i.down { transform: rotate(90deg); }
.sheet.ask { border-bottom: 2px solid var(--ink); }
.sheet.ask p { font: 600 1.05rem/1.4 var(--font-body); margin: 4px 0 6px; }
.sheet.ask .row button { flex: 1; }
.rank-hero { background: var(--ink); color: var(--cream); text-align: center; padding-top: 26px; }
.rank-hero h2 { font: 800 2.6rem/1 var(--font-display); margin: 6px 0 14px; }
.rank-badge { display: inline-block; animation: pop .6s var(--ease) .2s backwards, float 4s ease-in-out 1s infinite; }
.rank-badge .badge { filter: drop-shadow(5px 5px 0 var(--beige)); }
.rank-bar { height: 12px; border: 2px solid var(--cream); border-radius: 99px; overflow: hidden; }
.rank-bar .fl { height: 100%; width: 0; background: var(--cream); transition: width 1.1s var(--ease); }
.rank-bar.thin { height: 8px; border-color: var(--ink); margin: 8px 0 6px; }
.rank-bar.thin .fl { background: var(--ink); }
.ladder { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin: 0 0 18px; animation: drop .6s var(--ease) backwards; animation-delay: 70ms; }
.ladder div { display: grid; justify-items: center; gap: 4px; opacity: .4; }
.ladder div.past { opacity: .75; }
.ladder div.on { opacity: 1; }
.ladder div.on .badge { transform: scale(1.15); }
.ladder span { font: 500 9px/1 var(--font-mono); letter-spacing: 0; text-transform: uppercase; }
.lift { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px 0; border-bottom: 2px dashed var(--beige); }
.lift:last-of-type { border-bottom: 0; }
.lift b { display: block; font: 800 1.02rem/1.15 var(--font-display); }
.lift small { display: block; color: var(--muted); font-size: .8rem; margin-top: 3px; }
.rank-up { display: flex; align-items: center; justify-content: center; gap: 14px; background: var(--ink); color: var(--cream); border-radius: 16px; padding: 14px; margin: 0 0 14px; animation: pop .6s var(--ease) .4s backwards; text-align: left; }
.rank-up b { display: block; font: 800 1.8rem/1 var(--font-display); }
.rank-up .kicker { color: var(--beige); }
.badge { flex: none; display: block; }
.rank-hero .badge > path, .rank-up .badge > path { stroke: var(--beige); }
.live-head { position: sticky; top: 0; z-index: 5; background: var(--ink); color: var(--cream); border-radius: 18px; padding: 14px 16px; margin-bottom: 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px; box-shadow: 5px 5px 0 var(--beige); animation: drop .5s var(--ease) backwards; }
.live-head h2 { font: 800 1.2rem/1.1 var(--font-display); margin: 0; overflow-wrap: anywhere; }
.live-head .clock { font: 500 1.4rem/1 var(--font-mono); display: flex; align-items: center; gap: 6px; }
.live-head button { background: var(--cream); color: var(--ink); border-color: var(--cream); box-shadow: none; padding: 10px 14px; font-size: 14px; flex: none; }
.ex { padding: 16px 14px; }
.ex-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 4px; }
.ex-head h3 { font: 800 1.15rem/1.15 var(--font-display); margin: 0; }
.ex-head .kicker { display: block; margin-top: 4px; }
.last { font: 400 12px/1.4 var(--font-mono); color: var(--muted); margin: 6px 0 10px; display: flex; gap: 6px; align-items: center; }
.last .i { width: 14px; height: 14px; }
.sets { display: grid; gap: 8px; }
.set { display: grid; grid-template-columns: 30px minmax(0, 1fr) minmax(0, 1fr) 46px; gap: 8px; align-items: center; }
.set.head { font: 500 11px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.set.head span:not(:first-child) { text-align: center; }
.set .n { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; font: 800 13px/1 var(--font-display); }
.set input { padding: 9px 6px; text-align: center; font: 600 1.05rem/1 var(--font-mono); box-shadow: 2px 2px 0 var(--beige); }
.set .ok { width: 46px; height: 42px; padding: 0; border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); }
.set .ok .i { width: 22px; height: 22px; }
.set.done .ok { background: var(--ink); color: var(--cream); animation: pop .35s var(--ease); }

<script>
// ---------- Utilitaires ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ic = (name, cls = "") => `<svg class="i ${cls}"><use href="#i-${name}"/></svg>`;
const r0 = n => Math.round(Number(n) || 0);
const r1 = n => Math.round((Number(n) || 0) * 10) / 10;
const fmt = n => r0(n).toLocaleString("fr-FR");
const fmtKg = n => (Math.round(n * 10) / 10).toLocaleString("fr-FR");
const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const mmss = s => `${Math.floor(s / 60)}:${String(Math.max(0, Math.floor(s % 60))).padStart(2, "0")}`;
// Fenêtre de confirmation maison : confirm() est bloqué dans la page claude.ai.
function ask(msg, okLabel = "Confirmer") {
  return new Promise(res => {
    const bg = document.createElement("div"); bg.className = "sheet-bg";
    bg.innerHTML = `<div class="sheet ask" role="alertdialog"><p>${esc(msg)}</p><div class="row"><button id="ask-no">Annuler</button><button class="primary" id="ask-ok">${esc(okLabel)}</button></div></div>`;
    document.body.appendChild(bg);
    const done = v => { bg.remove(); res(v); };
    bg.addEventListener("click", e => { if (e.target === bg) done(false); });
    $("#ask-no", bg).onclick = () => done(false); $("#ask-ok", bg).onclick = () => done(true);
  });
}
function toast(msg) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
$("#ticker").innerHTML = (() => {
  const s = ["Mange", "Soulève", "Progresse", "Bronze", "Argent", "Or", "Platine", "Élite", "Champion", "Unreal"].map(w => `<span>${w}</span><b>${ic("star")}</b>`).join("");
  return s + s;
})();

// ---------- Stockage : db par personne, sinon le navigateur ----------
let db = null, uid = null, sample = null;
const local = {
  get(k) { try { return JSON.parse(localStorage.getItem("mygym:" + k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("mygym:" + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem("mygym:" + k); } catch {} },
};
const store = {
  profileRef() { return db.collection("data/users/" + uid).doc("profile"); },
  mealsCol() { return db.collection("data/users/" + uid).doc("nutrition").collection("meals"); },
  sessionsCol() { return db.collection("data/users/" + uid).doc("training").collection("sessions"); },
  async getProfile() {
    // Les données lues depuis db sont gelées : on travaille sur une copie.
    if (db) { try { const s = await this.profileRef().get(); if (s.exists) return JSON.parse(JSON.stringify(s.data())); } catch {} }
    return local.get("profile");
  },
  async saveProfile(p) {
    local.set("profile", p);
    if (db) await this.profileRef().set(p);
  },
  async getMeals(fromKey) {
    if (db) {
      try { const q = await this.mealsCol().where("date", ">=", fromKey).get(); return q.docs.map(d => ({ id: d.id, ...JSON.parse(JSON.stringify(d.data())) })); } catch {}
    }
    return (local.get("meals") || []).filter(m => m.date >= fromKey);
  },
  async addMeal(m) {
    if (db) { const ref = this.mealsCol().doc(); await ref.set(m); return ref.id; }
    const all = local.get("meals") || []; m.id = "m" + Date.now(); all.push(m); local.set("meals", all.slice(-400)); return m.id;
  },
  async deleteMeal(id) {
    if (db) return this.mealsCol().doc(id).delete();
    local.set("meals", (local.get("meals") || []).filter(m => m.id !== id));
  },
  async getSessions() {
    if (db) {
      try { const q = await this.sessionsCol().orderBy("at", "desc").limit(60).get(); return q.docs.map(d => ({ id: d.id, ...JSON.parse(JSON.stringify(d.data())) })); } catch {}
    }
    return (local.get("sessions") || []).sort((a, b) => b.at - a.at).slice(0, 60);
  },
  planRef() { return db.collection("data/users/" + uid).doc("plan"); },
  async getPlan() {
    if (db) { try { const s = await this.planRef().get(); if (s.exists) return JSON.parse(JSON.stringify(s.data())); } catch {} }
    return local.get("plan");
  },
  async savePlan(pl) {
    local.set("plan", pl);
    if (db) await this.planRef().set(JSON.parse(JSON.stringify(pl)));
  },
  ranksRef() { return db.collection("data/users/" + uid).doc("ranks"); },
  async getBests() {
    if (db) { try { const s = await this.ranksRef().get(); if (s.exists) return JSON.parse(JSON.stringify(s.data())).bests || {}; } catch {} }
    return local.get("bests") || {};
  },
  async saveBests(b) {
    local.set("bests", b);
    if (db) await this.ranksRef().set({ bests: JSON.parse(JSON.stringify(b)), updatedAt: Date.now() });
  },
  async addSession(s) {
    if (db) { const ref = this.sessionsCol().doc(); await ref.set(s); return ref.id; }
    const all = local.get("sessions") || []; s.id = "s" + Date.now(); all.push(s); local.set("sessions", all.slice(-200)); return s.id;
  },
};

// ---------- Profil : listes de choix ----------
const GOALS = {
  cut:    { label: "Perdre du gras", ico: "flame", sub: "Sèche progressive" },
  bulk:   { label: "Prendre du muscle", ico: "gym", sub: "Prise de masse propre" },
  force:  { label: "Gagner en force", ico: "bolt", sub: "Soulever plus lourd" },
  cardio: { label: "Améliorer mon cardio", ico: "heart", sub: "Souffle et endurance" },
  tone:   { label: "Me tonifier", ico: "sparkle", sub: "Dessiner la silhouette" },
  health: { label: "Rester en forme", ico: "leaf", sub: "Santé et énergie au quotidien" },
};
const LEVELS = { deb: "Débutant", int: "Intermédiaire", conf: "Confirmé" };
const JOBS = { assis: "Assis", debout: "Debout", physique: "Physique" };
const SLEEP = { "-6": "Moins de 6 h", "6-7": "6 à 7 h", "8+": "8 h et plus" };
const PLACES = { salle: "Salle", maison: "Maison", mix: "Les deux" };
const EQUIP = { machine: "Machines", barre: "Barre", halteres: "Haltères", poulie: "Poulie", elastique: "Élastiques", corps: "Poids du corps" };
const ZONES = { epaules: "Épaules", dos: "Dos", genoux: "Genoux", poignets: "Poignets", coudes: "Coudes" };
const DIETS = { tout: "Je mange de tout", vege: "Végétarien", vegan: "Végan", halal: "Halal" };
const INTOL = { lactose: "Lactose", gluten: "Gluten", noix: "Fruits à coque", poisson: "Poisson" };
const MODES = { seche: "Sèche", masse: "Prise de masse", recompo: "Recomposition", maintien: "Maintien" };

// ---------- Moteur nutrition (Mifflin-St Jeor, objectifs combinés) ----------
function targets(p) {
  const bmr = 10 * p.weight + 6.25 * p.height - 5 * p.age + (p.sex === "f" ? -161 : 5);
  const base = { assis: 1.25, debout: 1.4, physique: 1.55 }[p.job] || 1.25;
  const hours = p.sessions * (p.duration || 60) / 60;
  const factor = base + Math.min(0.35, hours * 0.04);
  const tdee = bmr * factor, g = new Set(p.goals);
  let mode = "maintien", kcal = tdee;
  if (g.has("cut") && g.has("bulk")) { mode = "recompo"; kcal = tdee * 0.95; }
  else if (g.has("cut")) { mode = "seche"; kcal = tdee - Math.min(tdee * 0.2, 500); }
  else if (g.has("bulk")) { mode = "masse"; kcal = tdee * 1.1; }
  const protPerKg = Math.max(1.6, ...p.goals.map(k => ({ cut: 2.0, bulk: 1.8, force: 1.8, tone: 1.8, cardio: 1.6, health: 1.6 }[k] || 1.6)), mode === "recompo" ? 2.2 : 0);
  const fatPerKg = mode === "seche" || g.has("cardio") ? 0.8 : mode === "masse" ? 1.0 : 0.9;
  const prot = protPerKg * p.weight, fat = fatPerKg * p.weight;
  const carbs = Math.max(0, (kcal - prot * 4 - fat * 9) / 4);
  return { bmr: r0(bmr), tdee: r0(tdee), kcal: Math.round(kcal / 10) * 10, prot: r0(prot), fat: r0(fat), carbs: r0(carbs), mode };
}
// Schéma d'entraînement : décidé par l'objectif principal (le premier choisi).
function scheme(p) {
  const main = p.goals[0];
  if (main === "force") return { reps: 5, rest: 150, sets: 4 };
  if (main === "cardio" || main === "health") return { reps: 12, rest: 60, sets: 3 };
  if (main === "cut") return { reps: 12, rest: 75, sets: 3 };
  return { reps: 10, rest: 90, sets: 3 };
}

// Remplace un exercice impossible (matériel manquant ou zone à ménager) par un autre du même groupe.
function adapt(id, p) {
  const e = EXI[id];
  if (usable(e, p) && safe(e, p)) return e;

  t.ex.forEach(id => { const e = adapt(id, p); if (e && !seen.has(e.id)) { seen.add(e.id); out.push(e); } });
  return out;
}

function resizeImage(file, max, q, asDataUrl) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      if (asDataUrl) res(c.toDataURL("image/jpeg", q)); else c.toBlob(b => b ? res(b) : rej(), "image/jpeg", q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

const e1rm = (kg, reps) => kg * (1 + reps / 30);
function lastFor(exId) {
  for (const s of sessions) { const e = s.exercises.find(x => x.id === exId); if (e && e.sets.length) return { sets: e.sets, at: s.at }; }
  return null;
}
function bestFor(exId) {
  let best = 0;
  sessions.forEach(s => s.exercises.forEach(e => { if (e.id === exId) e.sets.forEach(st => { best = Math.max(best, e1rm(st.kg, st.reps)); }); }));
  return best;
}
function lastLabel(sets, bw) {
  const kg = st => bw ? (st.kg ? `+${fmtKg(st.kg)} kg` : "") : `${fmtKg(st.kg)} kg`;
  const same = sets.every(st => st.kg === sets[0].kg && st.reps === sets[0].reps);
  if (same) return `${sets.length} × ${sets[0].reps}${kg(sets[0]) ? " à " + kg(sets[0]) : ""}`;
  return sets.map(st => `${st.reps}${bw ? (st.kg ? "+" + fmtKg(st.kg) : "") : "×" + fmtKg(st.kg)}`).join(" · ");
}
// Progression : si toutes les séries de la dernière fois ont atteint l'objectif de reps, on ajoute de la charge.
function newExercise(item) {
  const last = lastFor(item.id), lib = EXI[item.id];
  const inc = lib && (lib.eq === "halteres" || lib.eq === "elastique") ? 1 : 2.5;
  const up = last && !item.bw && last.sets.length >= item.sets && last.sets.every(st => st.reps >= item.reps && st.kg > 0) ? inc : 0;
  const sets = Array.from({ length: item.sets }, (_, i) => {
    const ref = last ? last.sets[Math.min(i, last.sets.length - 1)] : null;
    return { kg: ref && ref.kg ? ref.kg + up : (item.bw ? 0 : ""), reps: item.reps, done: false };
  });
  return { id: item.id, name: item.name, group: item.group, bw: item.bw, rest: item.rest, note: item.note || "", sets, up };
}

// Feuille de choix d'exercice : bibliothèque + exercice perso tapé à la main.
function openPicker(onPick, exclude = []) {
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  bg.innerHTML = `<div class="sheet" role="dialog" aria-label="Choisir un exercice">
    <h2>Ajouter un exercice <button class="sq flat" id="pk-close" aria-label="Fermer">${ic("x")}</button></h2>
    <input type="search" id="pk-q" placeholder="Rechercher ou taper un exercice perso">
    <div class="list" id="pk-list"></div></div>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.addEventListener("click", e => { if (e.target === bg) close(); });
  $("#pk-close", bg).onclick = close;
  const pick = e => { close(); onPick(e); };
  const draw = q => {
    const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    const nq = norm(q.trim());
    const list = EX.filter(e => usable(e, profile) && (!nq || norm(e.name + " " + e.group).includes(nq)));
    const groups = [...new Set(list.map(e => e.group))];
    const custom = q.trim().length >= 3 ? `<button class="pick" data-custom="1"><span>Ajouter « ${esc(q.trim())} »</span><span class="tag">Perso</span></button>` : "";
    $("#pk-list", bg).innerHTML = custom + groups.map(g => `<p class="grp">${g}</p>${list.filter(e => e.group === g).map(e => {
      const warn = !safe(e, profile);
      return `<button class="pick" data-pick="${e.id}" ${exclude.includes(e.id) ? "disabled" : ""}><span>${esc(e.name)}</span>${warn ? `<span class="tag warn">À ménager</span>` : `<span class="tag">${EQUIP[e.eq]}</span>`}</button>`;
    }).join("")}`).join("") + (list.length || custom ? "" : `<p class="muted">Aucun exercice trouvé.</p>`);
    bg.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => pick(EXI[b.dataset.pick]));
    bg.querySelector("[data-custom]")?.addEventListener("click", () => { const name = q.trim().slice(0, 50); pick({ id: "c_" + slug(name), name, group: "Perso", bw: false }); });
  };
  draw("");
  $("#pk-q", bg).addEventListener("input", e => draw(e.target.value));
}

async function finishSession() {
  const done = live.exercises.map(ex => ({ id: ex.id, name: ex.name, bw: ex.bw, sets: ex.sets.filter(s => s.done).map(s => ({ kg: Number(s.kg) || 0, reps: Number(s.reps) || 0 })) })).filter(ex => ex.sets.length);
  if (!done.length) {
    if (await ask("Aucune série validée. Arrêter cette séance sans l'enregistrer ?", "Arrêter")) { live = null; saveLive(); hideRest(); render(); }
    return;
  }
  if (live.exercises.some(ex => ex.sets.some(s => !s.done)) && !(await ask("Certaines séries ne sont pas validées, elles ne seront pas comptées. Terminer ?", "Terminer"))) return;
  const records = done.filter(ex => !ex.bw).map(ex => {
    const prev = bestFor(ex.id), now = Math.max(...ex.sets.map(s => e1rm(s.kg, s.reps)));
    return prev > 0 && now > prev + 0.01 ? { name: ex.name, e1rm: r1(now), gain: r1(now - prev) } : null;
  }).filter(Boolean);
  const s = {
    date: dayKey(new Date(live.at)), at: live.at, end: Date.now(), title: live.title, tplId: live.tplId || null,
    durationMin: Math.max(1, Math.round((Date.now() - live.at) / 60000)),
    exercises: done, setsDone: done.reduce((a, ex) => a + ex.sets.length, 0),
    volume: r0(done.reduce((a, ex) => a + ex.sets.reduce((b, st) => b + st.kg * st.reps, 0), 0)),
    records,
  };
  const btn = $("#finish"); btn.disabled = true; btn.textContent = "…";
  try {
    s.id = await store.addSession({ ...s });
    sessions.unshift(s);
    const before = Object.fromEntries(Object.keys(RANK_LIFTS).map(id => [id, liftRank(id)?.idx ?? -1])), gBefore = globalRank().idx;
    const changed = mergeBests([s]);
    if (changed.length) store.saveBests(bests).catch(() => {});
    s.rankUps = changed.map(liftRank).filter(l => l.idx > before[l.id]).map(l => ({ name: l.ex.name, idx: l.idx, first: before[l.id] < 0 }));
    s.globalUp = globalRank().idx > gBefore ? globalRank().idx : null;
    live = null; saveLive(); hideRest();
    summary = s; render(); window.scrollTo({ top: 0 });
  } catch { btn.disabled = false; btn.textContent = "Terminer"; toast("Enregistrement impossible, réessaie"); }
}
function renderSummary() {
  const s = summary;
  $("#app").innerHTML = `<section class="screen reveal" style="text-align:center">
    <div class="card" style="--i:0">
      <p class="kicker">Séance terminée</p>
      <h2 style="font-size:2rem;margin:8px 0 18px">Bien joué, ${esc(profile.name)} !</h2>
      <div class="stats three">
        <div class="stat" style="--i:1"><span class="kicker">Durée</span><b>${s.durationMin}</b><span class="muted small">min</span></div>
        <div class="stat" style="--i:2"><span class="kicker">Séries</span><b>${s.setsDone}</b><span class="muted small">validées</span></div>
        <div class="stat" style="--i:3"><span class="kicker">Volume</span><b id="vol">0</b><span class="muted small">kg soulevés</span></div>
      </div>
      ${s.globalUp != null ? `<div class="rank-up">${badge(s.globalUp, 72)}<div><span class="kicker">Nouveau rang</span><b>${RANKS[s.globalUp][1]}</b></div></div>` : ""}
      ${s.rankUps?.length ? `<div class="records">${s.rankUps.map((r, i) => `<div style="--i:${i}">${badge(r.idx, 30)}<span><b>${esc(r.name)} : ${RANKS[r.idx][1]}</b><br><span class="muted small">${r.first ? "Premier classement" : "Tu montes d'un rang"}</span></span></div>`).join("")}</div>` : ""}
      ${s.records.length ? `<div class="records">${s.records.map((r, i) => `<div style="--i:${i}">${ic("medal")}<span><b>Record : ${esc(r.name)}</b><br><span class="muted small">Max estimé ${fmtKg(r.e1rm)} kg (+${fmtKg(r.gain)} kg)</span></span></div>`).join("")}</div>`
        : `<p class="muted small">Pas de record cette fois. La régularité fait le travail.</p>`}
      <button class="primary big" id="sum-ok" style="margin-top:12px">Retour ${ic("right")}</button>
    </div></section>`;
  countUp($("#vol"), s.volume, 1200);
  $("#sum-ok").onclick = () => { summary = null; tab = "home"; render(); };
}

// ---------- Programme : ma semaine ----------
let planAI = { text: "", busy: false, error: null, why: "" }, planUndo = null;
function renderPlan() {
  const w = weekInfo();
  const opts = sel => `<option value="">Repos</option>${plan.templates.map(t => `<option value="${t.id}" ${sel === t.id ? "selected" : ""}>${esc(t.name)}</option>`).join("")}`;
  $("#app").innerHTML = `<section class="screen">
    <div class="card" style="--i:0;background:var(--ink);color:var(--cream)">
      <p class="kicker" style="color:var(--beige)">Ma semaine</p>
      <h2 style="font-size:1.9rem;margin:6px 0 4px">${w.planned} séance${w.planned > 1 ? "s" : ""} prévue${w.planned > 1 ? "s" : ""}</h2>
      <p style="margin:0;color:var(--beige);font-size:.92rem">${w.doneCount} faite${w.doneCount > 1 ? "s" : ""} cette semaine. Choisis une séance pour chaque jour, ou laisse en repos.</p>
    </div>
    <div class="card" style="--i:1">
      ${w.days.map(d => `
      <div class="day ${d.today ? "today" : ""}">
        <div class="dl"><b>${d.label.slice(0, 3)}</b><span>${d.date.getDate()}</span></div>
        <div style="min-width:0"><select data-day="${d.k}" aria-label="Séance du ${d.label}">${opts(d.tpl?.id || "")}</select>
          ${d.tpl ? `<small>${esc(d.tpl.sub || d.tpl.items.map(i => i.name).slice(0, 3).join(", "))}</small>` : ""}</div>
        ${d.done ? `<span class="go" title="Séance faite">${ic("check")}</span>` : d.tpl ? `<button class="go" data-start="${d.tpl.id}" aria-label="Lancer ${esc(d.tpl.name)}">${ic("play")}</button>` : `<span></span>`}
      </div>`).join("")}
    </div>
    <div class="card" style="--i:2">
      <h2>Organiser avec l'IA</h2>
      ${planAI.busy ? `<p style="margin:0;font-weight:600">L'IA organise ta semaine…</p><div class="progress"></div>` : `
      <div class="field"><textarea id="plan-ai" rows="3" placeholder="Ex : je suis dispo lundi, mercredi et samedi, 1 h max, je veux insister sur les pecs">${esc(planAI.text)}</textarea></div>
      ${planAI.error ? `<p style="font-weight:600;margin:0 0 10px">${esc(planAI.error)}</p>` : ""}
      ${planAI.why ? `<p class="small" style="margin:0 0 10px">${esc(planAI.why)}</p>` : ""}
      <div class="row">${planUndo ? `<button id="plan-undo">${ic("history")} Annuler</button>` : ""}<button class="primary" id="plan-ai-go">${ic("sparkle")} Organiser</button></div>`}
    </div>
    <button class="big" id="to-gym" style="--i:3">${ic("pen")} Modifier mes séances</button>
  </section>`;
  const app = $("#app");
  app.querySelectorAll("[data-day]").forEach(s => s.onchange = async () => { plan.week[s.dataset.day] = s.value; planUndo = null; await savePlan(); renderKeepScroll(); });
  app.querySelectorAll("[data-start]").forEach(b => b.onclick = () => startTpl(b.dataset.start));
  $("#to-gym").onclick = () => setTab("gym");
  $("#plan-ai")?.addEventListener("input", e => planAI.text = e.target.value);
  $("#plan-undo")?.addEventListener("click", async () => { plan = planUndo; planUndo = null; planAI.why = ""; await savePlan(); toast("Planning précédent remis"); renderKeepScroll(); });
  $("#plan-ai-go")?.addEventListener("click", async () => {
    if (!planAI.text.trim()) { toast("Dis à l'IA comment organiser ta semaine"); return; }
    planAI.busy = true; planAI.error = null; renderKeepScroll();
    try {
      const r = await aiWeek(planAI.text.trim());
      planUndo = JSON.parse(JSON.stringify(plan));
      plan.templates.push(...r.created); plan.week = r.week;
      await savePlan();
      planAI = { text: "", busy: false, error: null, why: r.why + (r.created.length ? ` (${r.created.length} nouvelle${r.created.length > 1 ? "s" : ""} séance${r.created.length > 1 ? "s" : ""} créée${r.created.length > 1 ? "s" : ""})` : "") };
      toast("Semaine organisée");
    } catch (e) { planAI.busy = false; planAI.error = e.friendly || "Erreur, réessaie."; }
    if (tab === "plan") renderKeepScroll();
  });
}

// ---------- Chrono de repos ----------
let rest = null, restTimer = null;
function startRest(sec) { rest = { end: Date.now() + sec * 1000, total: sec }; syncRest(); }
function hideRest() { rest = null; clearInterval(restTimer); $("#restbar").hidden = true; }
function syncRest() {
  clearInterval(restTimer);
  const bar = $("#restbar");
  if (!rest || !live || tab !== "gym") { bar.hidden = true; if (!live) rest = null; return; }
  bar.hidden = false;
  const tick = () => {
    const left = (rest.end - Date.now()) / 1000;
    if (left <= 0) {
      hideRest(); toast("Repos terminé, série suivante !");
      try { navigator.vibrate?.([200, 100, 200]); } catch {}
      try { const a = new AudioContext(), o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.15, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .5); o.start(); o.stop(a.currentTime + .5); } catch {}
      return;
    }
    $("#rest-t").textContent = mmss(Math.ceil(left));
    $("#rest-fill").style.width = (100 - left / rest.total * 100) + "%";
  };
  tick(); restTimer = setInterval(tick, 250);
}
$("#rest-minus").onclick = () => { if (rest) { rest.end -= 15000; syncRest(); } };
$("#rest-plus").onclick = () => { if (rest) { rest.end += 15000; rest.total += 15; syncRest(); } };
$("#rest-skip").onclick = hideRest;

// ---------- Rangs ----------
// Rang par exercice = max estimé (1RM Epley) divisé par le poids de corps, comparé à des paliers.
// Poids du corps (tractions, dips, pompes) : on compte les répétitions (le lest est converti en répétitions en plus).
const RANKS = [["bronze", "Bronze"], ["argent", "Argent"], ["or", "Or"], ["platine", "Platine"], ["elite", "Élite"], ["champion", "Champion"], ["unreal", "Unreal"]];
// Paliers pour passer Argent, Or, Platine, Élite, Champion, Unreal (hommes). up : haut du corps (paliers réduits pour les femmes).
const RANK_LIFTS = {
  bench:       { t: [0.6, 0.9, 1.05, 1.2, 1.5, 1.85], up: 1 },
  chest_press: { t: [0.65, 1, 1.15, 1.3, 1.65, 2], up: 1 },
  ohp:         { t: [0.4, 0.6, 0.7, 0.8, 1, 1.25], up: 1 },
  db_press:    { t: [0.15, 0.25, 0.3, 0.35, 0.45, 0.55], up: 1, per: 1 },
  lat:         { t: [0.55, 0.8, 0.925, 1.05, 1.3, 1.6], up: 1 },
  row:         { t: [0.55, 0.8, 0.95, 1.1, 1.4, 1.75], up: 1 },
  curl:        { t: [0.12, 0.2, 0.24, 0.28, 0.36, 0.45], up: 1, per: 1 },
  squat:       { t: [0.8, 1.2, 1.4, 1.6, 2, 2.5] },
  legpress:    { t: [1.2, 2, 2.4, 2.8, 3.6, 4.5] },
  deadlift:    { t: [1, 1.5, 1.75, 2, 2.5, 3] },
  pullup:      { t: [1, 6, 9, 12, 18, 25], reps: 1, up: 1 },
  dips:        { t: [4, 12, 16, 20, 30, 40], reps: 1, up: 1 },
  pushup:      { t: [10, 25, 32, 40, 55, 75], reps: 1, up: 1 },
};
let bests = {};
function liftSteps(id) {
  const L = RANK_LIFTS[id], f = profile.sex === "f" ? (L.reps ? 0.6 : L.up ? 0.6 : 0.7) : 1;
  return L.t.map(v => L.reps ? Math.max(1, Math.round(v * f)) : v * f);
}
// Valeur d'une série : kg de max estimé, ou répétitions équivalentes au poids du corps.
function setValue(id, st) {
  const bw = profile.weight, reps = Math.min(Number(st.reps) || 0, 15), kg = Number(st.kg) || 0;
  if (!reps) return 0;
  if (RANK_LIFTS[id].reps) return kg > 0 ? Math.round(30 * ((bw + kg) * (1 + reps / 30) / bw - 1)) : Number(st.reps) || 0;
  return kg > 0 ? e1rm(kg, reps) : 0;
}
function mergeBests(list) {
  const up = [];
  list.forEach(s => (s.exercises || []).forEach(ex => {
    if (!RANK_LIFTS[ex.id]) return;
    const v = Math.max(0, ...ex.sets.map(st => setValue(ex.id, st)));
    if (v > (bests[ex.id]?.v || 0)) { bests[ex.id] = { v: r1(v), at: s.at }; up.push(ex.id); }
  }));
  return up;
}
function liftRank(id) {
  const b = bests[id]; if (!b) return null;
  const L = RANK_LIFTS[id], steps = liftSteps(id), val = L.reps ? b.v : b.v / profile.weight;
  let idx = 0; while (idx < 6 && val >= steps[idx]) idx++;
  const lo = idx ? steps[idx - 1] : 0, hi = steps[idx];
  const frac = idx >= 6 ? 0 : Math.max(0, Math.min(1, (val - lo) / (hi - lo)));
  // Ce qu'il manque pour le palier suivant, en kg (ou en répétitions).
  const need = idx >= 6 ? null : L.reps ? hi : hi * profile.weight;
  return { id, idx, frac, score: idx + frac, val, best: b.v, need, ex: EXI[id] };
}
// Rang global : moyenne des 5 meilleurs exercices classés.
function globalRank() {
  const lifts = Object.keys(RANK_LIFTS).map(liftRank).filter(Boolean).sort((a, b) => b.score - a.score);
  if (!lifts.length) return { lifts, idx: 0, frac: 0, score: 0, count: 0 };
  const top = lifts.slice(0, 5), score = top.reduce((a, l) => a + l.score, 0) / top.length;
  const idx = Math.min(6, Math.floor(score));
  return { lifts, idx, frac: idx >= 6 ? 1 : score - idx, score, count: lifts.length };
}
// Badge dessiné : bouclier, couleur du métal, motif selon le rang.
function badge(idx, size = 64) {
  const fill = ["#C27C46", "#CFCAC0", "#E3B33F", "#C9DCE0", "#121110", "#121110", "url(#unreal-g)"][idx];
  const fg = idx >= 4 ? (idx === 5 ? "#E3B33F" : "#F4ECDD") : "#121110";
  const glyph = [
    `<path d="M22 38l10-7 10 7"/>`,
    `<path d="M22 34l10-7 10 7M22 42l10-7 10 7"/>`,
    `<path d="M22 30l10-7 10 7M22 37l10-7 10 7M22 44l10-7 10 7"/>`,
    `<path d="M32 20l11 12-11 12-11-12z"/><path d="M21 32h22M32 20v24"/>`,
    `<path d="M32 22l3 7.5 8 .6-6.1 5.2 1.9 7.8L32 39l-6.8 4.1 1.9-7.8L21 30.1l8-.6z" fill="${fg}"/>`,
    `<path d="M21 42V27l6 6 5-9 5 9 6-6v15z" fill="${fg}"/><path d="M21 46h22"/>`,
    `<path d="M32 18l3.4 10.6L46 32l-10.6 3.4L32 46l-3.4-10.6L18 32l10.6-3.4z" fill="${fg}"/><path d="M44 18l-3 3M20 18l3 3M44 46l-3-3M20 46l3-3"/>`,
  ][idx];
  return `<svg class="badge b-${RANKS[idx][0]}" width="${size}" height="${size}" viewBox="0 0 64 64" aria-label="${RANKS[idx][1]}">${idx === 6 ? `<defs><linearGradient id="unreal-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121110"/><stop offset=".5" stop-color="#4A3F35"/><stop offset="1" stop-color="#121110"/></linearGradient></defs>` : ""}
    <path d="M32 4l24 8v18c0 15-10 25-24 30C18 55 8 45 8 30V12z" fill="${fill}" stroke="#121110" stroke-width="3" stroke-linejoin="round"/>
    <g fill="none" stroke="${fg}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${glyph}</g></svg>`;
}
function renderRank() {
  const g = globalRank(), name = RANKS[g.idx][1], next = RANKS[g.idx + 1];
  const done = g.lifts, todo = Object.keys(RANK_LIFTS).filter(id => !bests[id] && usable(EXI[id], profile));
  const kgLabel = l => RANK_LIFTS[l.id].reps ? `${fmt(l.best)} reps` : `${fmtKg(l.best)} kg${RANK_LIFTS[l.id].per ? " par haltère" : ""}`;
  const needLabel = l => l.need == null ? "Rang maximum atteint" : RANK_LIFTS[l.id].reps ? `${RANKS[l.idx + 1][1]} à ${l.need} reps` : `${RANKS[l.idx + 1][1]} à ${fmtKg(Math.ceil(l.need * 2) / 2)} kg de max`;
  $("#app").innerHTML = `<section class="screen">
    <div class="card rank-hero" style="--i:0">
      <div class="rank-badge">${badge(g.idx, 112)}</div>
      <p class="kicker" style="color:var(--beige)">${g.count ? "Ton rang" : "Rang de départ"}</p>
      <h2>${name}</h2>
      ${g.count ? `<div class="rank-bar"><div class="fl" data-w="${g.idx >= 6 ? 100 : Math.round(g.frac * 100)}"></div></div>
      <p class="small" style="margin:8px 0 0;color:var(--beige)">${next ? `${Math.round(g.frac * 100)} % du chemin vers ${next[1]}` : "Tu es au sommet. Respect."}</p>`
      : `<p class="small" style="margin:6px 0 0;color:var(--beige)">Fais une séance avec un des exercices classés ci-dessous pour obtenir ton vrai rang.</p>`}
      ${g.count && g.count < 3 ? `<p class="small" style="margin:6px 0 0;color:var(--beige)">Classé sur ${g.count} exercice${g.count > 1 ? "s" : ""}. Teste-en au moins 3 pour un rang fiable.</p>` : ""}
    </div>
    <div class="ladder" style="--i:1">${RANKS.map((r, i) => `<div class="${i === g.idx ? "on" : i < g.idx ? "past" : ""}">${badge(i, 40)}<span>${r[1]}</span></div>`).join("")}</div>
    <div class="card" style="--i:2">
      <div class="card-head"><h2>Par exercice</h2><span class="kicker">${done.length} classé${done.length > 1 ? "s" : ""}</span></div>
      ${done.length ? done.map(l => `
        <div class="lift">${badge(l.idx, 40)}
          <div style="min-width:0"><b>${esc(l.ex.name)}</b><small>${RANKS[l.idx][1]} · ${RANK_LIFTS[l.id].reps ? "" : "max estimé "}${kgLabel(l)}${RANK_LIFTS[l.id].reps || RANK_LIFTS[l.id].per ? "" : ` · ${fmtKg(l.val)} × ton poids`}</small>
            <div class="rank-bar thin"><div class="fl" data-w="${l.idx >= 6 ? 100 : Math.round(l.frac * 100)}"></div></div>
            <small>${needLabel(l)}</small></div></div>`).join("")
      : `<p class="muted" style="margin:0">Aucun exercice classé pour l'instant.</p>`}
      ${todo.length ? `<p class="kicker" style="margin:16px 0 8px">Pas encore testés</p><p class="small muted" style="margin:0">${todo.map(id => esc(EXI[id].name)).join(" · ")}</p>` : ""}
    </div>
    <div class="card" style="--i:3">
      <h2>Comment ça marche</h2>
      <p class="small" style="margin:0 0 8px">Pour chaque exercice classé, MyGym prend ton meilleur max estimé (calculé à partir de tes séries) et le compare à ton poids de corps. Plus le ratio est haut, plus le rang monte, avec des paliers adaptés aux hommes et aux femmes.</p>
      <p class="small" style="margin:0">Ton rang global est la moyenne de tes 5 meilleurs exercices. Pour les tractions, les dips et les pompes, ce sont tes répétitions qui comptent.</p>
    </div>
  </section>`;
  animateBars();
}

// ---------- Profil ----------
function renderProfile() {
  const p = profile, t = p.targets;
  const list = (obj, arr) => arr.length ? arr.map(k => obj[k]).join(", ") : "Aucune";
  const block = (i, title, step, rows) => `<div class="card" style="--i:${i}"><div class="pf-row"><div style="min-width:0"><h2>${title}</h2><dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl></div>
    <button class="ghost" data-edit="${step}">Modifier</button></div></div>`;
  $("#app").innerHTML = `<section class="screen">
    <div class="card" style="--i:0;background:var(--ink);color:var(--cream)">
      <p class="kicker" style="color:var(--beige)">Ton objectif quotidien · ${MODES[t.mode]}</p>
      <h2 style="font-size:2.4rem;margin:6px 0 4px">${fmt(t.kcal)} kcal</h2>
      <p style="margin:0;font-family:var(--font-mono);font-size:.85rem;color:var(--beige)">P ${t.prot} g · G ${t.carbs} g · L ${t.fat} g · dépense ${fmt(t.tdee)} kcal</p>
    </div>
    ${block(1, "Toi", 1, [["Prénom", p.name], ["Sexe", p.sex === "f" ? "Femme" : "Homme"], ["Âge", p.age + " ans"], ["Taille", p.height + " cm"], ["Poids", fmtKg(p.weight) + " kg"], ["Poids visé", p.targetWeight ? fmtKg(p.targetWeight) + " kg" : "Non défini"]])}
    ${block(2, "Objectifs", 2, p.goals.map((k, i) => [i === 0 ? "Principal" : "Aussi", GOALS[k].label]))}
    ${block(3, "Quotidien", 3, [["Journée", JOBS[p.job]], ["Sommeil", SLEEP[p.sleep]]])}
    ${block(4, "Sport", 4, [["Niveau", LEVELS[p.level]], ["Rythme", `${p.sessions} × ${p.duration} min par semaine`], ["Lieu", PLACES[p.place]], ["Matériel", list(EQUIP, p.equipment)]])}
    ${block(5, "Santé et assiette", 5, [["À ménager", list(ZONES, p.injuries)], ["Alimentation", DIETS[p.diet]], ["Intolérances", list(INTOL, p.intolerances)]])}
    <button class="ghost" id="rename" style="margin:4px auto 0;display:flex">Changer de prénom</button>
  </section>`;
  $("#app").querySelectorAll("[data-edit]").forEach(b => b.onclick = () => startOnboarding(Number(b.dataset.edit)));
  $("#rename").onclick = () => startOnboarding(0);
}

// ---------- Démarrage ----------
// Les profils créés en V1 n'avaient qu'un objectif (goal) : on les convertit.
function upgradeProfile(p) {
  if (!p) return p;
  if (!Array.isArray(p.goals)) p.goals = p.goal ? [p.goal === "fit" ? "health" : p.goal] : ["health"];
  delete p.goal;
  p.targetWeight ??= ""; p.job ??= "assis"; p.sleep ??= "6-7"; p.duration ??= 60;
  p.equipment ??= p.place === "maison" ? ["corps"] : ["machine", "barre", "halteres", "poulie", "corps"];
  p.injuries ??= []; p.diet ??= "tout"; p.intolerances ??= [];
  p.targets = targets(p);
  return p;
}
(async () => {
  const cl = window.claude;
  if (cl?.use) {
    const [d, u, s] = await Promise.all([cl.use("db").catch(() => null), cl.use("user").catch(() => null), cl.use("sample").catch(() => null)]);
    sample = s;
    if (d && u) { try { uid = await u.id(); db = uid ? d : null; } catch { db = null; } }
  }
  profile = upgradeProfile(await store.getProfile());
  if (profile && profile.name) await enterApp(); else startOnboarding();
})().catch(e => {
  $("#app").innerHTML = `<div class="card"><h2>MyGym n'a pas pu démarrer</h2><p class="muted small" style="font-family:var(--font-mono)">${esc(e?.message || e)}</p><button class="primary" onclick="location.reload()">Réessayer</button></div>`;
});
</script>
